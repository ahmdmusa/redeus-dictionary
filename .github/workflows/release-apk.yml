name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache

      - name: Rename APK artifact
        run: |
          VERSION_NAME="${GITHUB_REF_NAME:-debug}"
          cp app/build/outputs/apk/debug/app-debug.apk "Sada-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sada-APK
          path: Sada-*.apk

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Sada (صَدى) ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            Sada-*.apk
